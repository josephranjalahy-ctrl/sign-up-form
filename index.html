<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="left">
        <img src="img/background-image.jpg" alt="green leafs">
        <div>
            <img src="img/odin.png" alt="odin logo">
            <p>Odin</p>
        </div>
        <p class="credit">Photo by <u>Hallie West</u> on <u>Unsplash</u></p>
    </section>

    <section class="right">
        <div class="promotional">
            <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams 
            <br>Sign-up <em>now</em> to get started</p>
            <p>You <em>know</em> you want to</p>
        </div>

        <form action="/" method="post">
            <h2>Let's do this!</h2>
            <div class="wrapper">
                <p>
                    <label for="first-name">FIRST NAME</label>
                    <input type="text" id="first-name" name="first-name" value="Thor">
                </p>
                <p>
                    <label for="last-name">LAST NAME</label>
                    <input type="text" id="last-name" name="last-name" value="Odinson" focus>
                </p>
                <p>
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="email">
                </p>
                <p>
                    <label for="phone">PHONE NUMBER</label>
                    <input type="tel" id="phone" name="phone">
                </p>
                <p>
                    <label for="pwd1">PASSWORD</label>
                    <input type="password" id="pwd1" name="pwd1" required>
                </p>
                <p>
                    <label for="pwd2">CONFIRM PASSWORD</label>
                    <input type="password" id="pwd2" name="pwd2" required>
                </p>
            </div>
        </form>

        <div class="connexion">
            <button>Create account</button>
            <p>Already have an account?</p><span style="font-weight: bold; color: green;">Log in</span>
        </div>
    </section>
</body>
</html>
